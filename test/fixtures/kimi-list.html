<div class="message-content">
  <p>设计 sidebar 时有三组核心权衡：</p>
  <ul>
    <li><strong>空间 vs 暴露</strong>：能收起，但不能丢上下文；默认展示高频入口，低频功能折叠进“更多/设置”。</li>
    <li><strong>简洁 vs 可发现</strong>：一级入口尽量少，建议 5–9 个；超过就分组、聚合或交给搜索。</li>
    <li><strong>稳定 vs 灵活</strong>：核心导航固定，业务入口可按权限/角色/工作流动态配置。</li>
  </ul>
</div>
