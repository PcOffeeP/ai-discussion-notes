name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install

      - name: Bundle Web Assets for Mobile
        run: npm run build:mobile

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Discussion-Notes-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Read Version Info
        id: version_info
        run: |
          VERSION=$(node -p "require('./version.json').version")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version_info.outputs.version }}
          name: "v${{ steps.version_info.outputs.version }} (Build ${{ steps.version_info.outputs.versionCode }})"
          body: |
            <!-- build-info: {"version":"${{ steps.version_info.outputs.version }}","versionCode":${{ steps.version_info.outputs.versionCode }}} -->
            GitHub Actions 自动构建的最新安卓 APP 安装包。App 内点击「检查更新」即可一键识别版本并完成升级。
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

