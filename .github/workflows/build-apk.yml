name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/broadsheet-recall-system

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install

      - name: Bundle Web Assets for Mobile
        run: npm run build:mobile

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Discussion-Notes-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/broadsheet-recall-system'
        with:
          tag_name: latest-mobile
          name: "最新移动端测试版 (Latest Mobile Build)"
          body: "GitHub Actions 自动构建的最新安卓 APP 安装包。手机打开此页面或在 App 内点击「检查更新」即可一键升级。"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
