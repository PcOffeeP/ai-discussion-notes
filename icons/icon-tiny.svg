<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .plate { fill: #F8F6F0; }
    .ink { fill: #1A1918; }
    .crimson { fill: #A31D1D; }
    .on-crimson { fill: #F8F6F0; }

    @media (prefers-color-scheme: dark) {
      .plate { fill: #16181D; }
      .ink { fill: #ECE8DF; }
      .crimson { fill: #D43838; }
      .on-crimson { fill: #16181D; }
    }
  </style>

  <!-- 1. 新闻纸底板 -->
  <rect class="plate" width="512" height="512" rx="108"/>

  <!-- ==================== 顶部牛津线与朱砂印水平齐平 ==================== -->
  <rect class="ink" x="52" y="60" width="224" height="42" rx="6"/>
  <rect class="ink" x="52" y="118" width="224" height="20" rx="4"/>

  <!-- 右上角朱砂印泥大方印 (与右侧边距 52px 绝对对称，X: 320~460, Y: 56~196) -->
  <g transform="translate(320, 56)">
    <rect class="crimson" width="140" height="140" rx="26"/>
    <path class="on-crimson" d="M70 24 C70 48 54 70 28 70 C54 70 70 92 70 116 C70 92 86 70 112 70 C86 70 70 48 70 24 Z"/>
  </g>

  <!-- ==================== 正文双栏块面 (基线水平对称锁死) ==================== -->
  <!-- 行 1: Y=236, H=48 -->
  <rect class="ink" x="52" y="236" width="180" height="48" rx="8"/>
  <rect class="ink" x="280" y="236" width="180" height="48" rx="8"/>

  <!-- 行 2: Y=310, H=48 -->
  <!-- 左栏带一抹朱砂立柱 -->
  <rect class="crimson" x="52" y="310" width="18" height="122" rx="4"/>
  <rect class="ink" x="84" y="310" width="148" height="48" rx="8"/>
  <rect class="ink" x="280" y="310" width="180" height="48" rx="8"/>

  <!-- 行 3: Y=384, H=48 (底部对齐) -->
  <rect class="ink" x="84" y="384" width="118" height="48" rx="8"/>
  <rect class="ink" x="280" y="384" width="140" height="48" rx="8"/>
</svg>