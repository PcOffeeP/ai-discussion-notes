<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .plate { fill: #F8F6F0; }
    .ink { fill: #1A1918; }
    .ink-sub { fill: #1A1918; fill-opacity: 0.38; }
    .ink-head { fill: #1A1918; fill-opacity: 0.88; }
    .rule-faint { stroke: #1A1918; stroke-opacity: 0.16; }
    .card-border { stroke: #1A1918; stroke-opacity: 0.28; }
    .card-bg { fill: #1A1918; fill-opacity: 0.035; }
    .crimson { fill: #A31D1D; }
    .on-crimson { fill: #F8F6F0; }

    @media (prefers-color-scheme: dark) {
      .plate { fill: #16181D; }
      .ink { fill: #ECE8DF; }
      .ink-sub { fill: #ECE8DF; fill-opacity: 0.38; }
      .ink-head { fill: #ECE8DF; fill-opacity: 0.88; }
      .rule-faint { stroke: #ECE8DF; stroke-opacity: 0.18; }
      .card-border { stroke: #ECE8DF; stroke-opacity: 0.32; }
      .card-bg { fill: #ECE8DF; fill-opacity: 0.05; }
      .crimson { fill: #C52828; }
      .on-crimson { fill: #16181D; }
    }
  </style>

  <!-- 1. 新闻纸底板 -->
  <rect class="plate" width="512" height="512" rx="108"/>

  <!-- 2. 顶部报头: 牛津双线与朱砂印齐平 -->
  <rect class="ink" x="64" y="74" width="284" height="16" rx="3"/>
  <rect class="ink" x="64" y="98" width="284" height="5" rx="1"/>
  <rect class="ink-sub" x="64" y="122" width="168" height="10" rx="2"/>

  <!-- 右上角朱砂印泥方印 -->
  <g transform="translate(368, 64)">
    <rect class="crimson" width="80" height="80" rx="16"/>
    <path class="on-crimson" d="M40 14 C40 28 31 40 16 40 C31 40 40 52 40 66 C40 52 49 40 64 40 C49 40 40 28 40 14 Z"/>
  </g>

  <!-- 报头与正文水平分隔线 -->
  <line class="rule-faint" x1="64" y1="156" x2="448" y2="156" stroke-width="1.5"/>

  <!-- 中央垂直分栏线 -->
  <line class="rule-faint" x1="256" y1="172" x2="256" y2="430" stroke-width="2"/>

  <!-- 行 1: 双栏大标题水平对齐 -->
  <rect class="ink-head" x="64" y="176" width="180" height="24" rx="3"/>
  <rect class="ink-head" x="268" y="176" width="180" height="24" rx="3"/>

  <!-- 行 2: 导读横线水平对齐 -->
  <rect class="ink-sub" x="64" y="212" width="140" height="10" rx="2"/>
  <rect class="ink-sub" x="268" y="212" width="150" height="10" rx="2"/>

  <!-- 行 3: 核心模块上下边界对齐 -->
  <rect class="crimson" x="64" y="236" width="6" height="80" rx="2"/>
  <rect class="ink-head" x="80" y="240" width="164" height="10" rx="2"/>
  <rect class="ink-head" x="80" y="260" width="164" height="10" rx="2"/>
  <rect class="ink-head" x="80" y="280" width="132" height="10" rx="2"/>
  <rect class="ink-head" x="80" y="300" width="150" height="10" rx="2"/>

  <rect class="card-bg" x="268" y="236" width="180" height="80" rx="4"/>
  <rect class="card-border" x="268" y="236" width="180" height="80" rx="4" fill="none" stroke-width="2"/>
  <rect class="ink-head" x="284" y="258" width="148" height="10" rx="2"/>
  <rect class="crimson" x="284" y="282" width="108" height="10" rx="2"/>

  <!-- 行 4: 正文每行基线严格对齐 -->
  <rect class="ink-sub" x="64" y="336" width="180" height="10" rx="2"/>
  <rect class="ink-sub" x="268" y="336" width="180" height="10" rx="2"/>

  <rect class="ink-sub" x="64" y="356" width="180" height="10" rx="2"/>
  <rect class="ink-sub" x="268" y="356" width="180" height="10" rx="2"/>

  <rect class="ink-sub" x="64" y="376" width="180" height="10" rx="2"/>
  <rect class="ink-sub" x="268" y="376" width="180" height="10" rx="2"/>

  <rect class="ink-sub" x="64" y="396" width="180" height="10" rx="2"/>
  <rect class="ink-sub" x="268" y="396" width="180" height="10" rx="2"/>

  <rect class="ink-sub" x="64" y="416" width="124" height="10" rx="2"/>
  <rect class="ink-sub" x="268" y="416" width="112" height="10" rx="2"/>
</svg>