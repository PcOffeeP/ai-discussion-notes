<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Discussion Notes</title>
  <link rel="stylesheet" href="notes.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">AI Discussion Notes</h1>
    <div class="topbar-actions">
      <input id="search" type="search" placeholder="Search notes..." autocomplete="off" />
      <button id="settings-btn" class="ghost-btn" title="Settings">Settings</button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar：过滤器，不是管理器（消费已有数据，不引入新实体） -->
    <nav class="sidebar" id="sidebar">
      <button class="side-item" id="side-all" data-filter="all">
        <span>All Notes</span><span class="side-count" id="count-all">0</span>
      </button>
      <div class="side-section">Sources</div>
      <div id="side-sources"></div>
      <div class="side-section">Conversations</div>
      <div id="side-conversations"></div>
    </nav>

    <main class="main">
      <!-- Empty state（兼产品教学） -->
      <section id="empty-state" class="empty hidden">
        <h2>Your best AI insights, saved.</h2>
        <p>Select useful text in ChatGPT and save it here.</p>
        <a class="primary-btn" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT</a>
      </section>

      <div id="groups" class="groups"></div>
      <p id="no-results" class="no-results hidden">No notes match.</p>
    </main>
  </div>

  <!-- Settings drawer -->
  <div id="settings-overlay" class="overlay hidden"></div>
  <aside id="settings-panel" class="settings hidden" aria-label="Settings">
    <div class="settings-head">
      <h2>Settings</h2>
      <button id="settings-close" class="ghost-btn">Close</button>
    </div>

    <section class="settings-section">
      <h3>Capture Button</h3>
      <label class="toggle-row">
        <input type="checkbox" id="capture-toggle" />
        <span>Show the "＋ Note" button when text is selected</span>
      </label>
    </section>

    <section class="settings-section">
      <h3>Data</h3>
      <p><span id="note-count">0</span> notes saved locally</p>
      <div class="settings-actions">
        <button id="export-btn" class="ghost-btn">Export Notes (JSON)</button>
        <button id="clear-btn" class="danger-btn">Clear All Notes</button>
      </div>
    </section>
  </aside>

  <script src="../core/note.js"></script>
  <script src="../core/group.js"></script>
  <script src="../core/pipeline.js"></script>
  <script src="../adapters/chrome/runtime-client.js"></script>
  <script src="../client/aidn.js"></script>
  <script src="../vendor/markdown-it.min.js"></script>
  <script src="../vendor/dompurify.min.js"></script>
  <script src="notes.js"></script>
</body>
</html>
